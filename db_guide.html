<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/png" href="https://iruna-online.com/img/fankit/Colon_orange.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>คู่มือ (Guides) | อิลูน่าพลัส</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Noto+Sans+Thai:wght@300;400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="db_common.css">
<style>
  .bgm-player-bar {
    position: sticky; top: 8px; z-index: 60;
    background: rgba(14, 17, 32, 0.96); backdrop-filter: blur(10px);
    border: 1px solid var(--gold); border-radius: 12px;
    padding: 14px 16px; margin-bottom: 16px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.55);
  }
  .bgm-now {
    display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px;
    margin-bottom: 10px;
  }
  .bgm-now-title { font-size: 15.5px; font-weight: 700; color: var(--gold-light); }
  .bgm-audio { width: 100%; height: 40px; margin-bottom: 10px; border-radius: 8px; }
  .bgm-controls { display: flex; flex-wrap: wrap; gap: 7px; align-items: center; }
  .bgm-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px;
  }
  .bgm-item {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 11px 13px; border-radius: 9px;
    background: var(--card); border: 1px solid var(--border);
    color: var(--text); cursor: pointer; text-align: left; font-family: inherit;
    transition: all .16s;
  }
  .bgm-item:hover { border-color: var(--accent); background: var(--card-hover); }
  .bgm-item.playing {
    background: rgba(212,168,67,0.16); border-color: var(--gold);
    box-shadow: 0 0 16px rgba(212,168,67,0.18);
  }
  .bgm-num {
    font-size: 11.5px; font-weight: 700; color: var(--gold);
    background: rgba(212,168,67,0.12); border: 1px solid rgba(212,168,67,0.3);
    padding: 2px 7px; border-radius: 5px; flex-shrink: 0;
  }
  .bgm-title { font-size: 13.5px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bgm-icon { font-size: 13px; color: var(--accent); flex-shrink: 0; }
  .bgm-item.playing .bgm-icon { color: var(--gold-light); }
  @media (max-width: 720px) {
    .bgm-player-bar { padding-left: 14px; }
    .bgm-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div id="stars"></div>
<div id="sb-root"></div>

<div class="hero">
  <h1 class="hero-title" id="hero-title">📚 คู่มือ Iruna Online</h1>
  <p class="hero-desc" id="hero-desc">คลังคู่มือข้อมูลระบบเกมทั้งหมดจาก Iruna Online Database</p>
</div>

<div class="main-wrapper">
  <div class="tab-strip" id="guide-tabs"></div>
  <div id="sub-toolbar"></div>
  <div id="guide-body"><div class="loader">กำลังโหลดคู่มือ...</div></div>
</div>

<script src="db_common.js"></script>
<script>
DB.initSidebar();

const GUIDE_LIST = [
  { key: 'pets', label: '🐾 สัตว์เลี้ยง (Pets)' },
  { key: 'stats', label: '📈 ค่าสถานะ (Stats)' },
  { key: 'skills', label: '✨ สกิล (Skills)' },
  { key: 'abilities', label: '⭐ อบิลิตี้ (☆Abilities)' },
  { key: 'abilities2', label: '🎯 ดรอปอบิลิตี้ (Beta)' },
  { key: 'apostolia', label: '🔮 Apostolia' },
  { key: 'refinement', label: '🔨 การตีบวก' },
  { key: 'raids', label: '🐉 เรดบอส (Raids)' },
  { key: 'lottery', label: '🎰 ลอตเตอรี่' },
  { key: 'background_music', label: '🎵 เพลงประกอบ' },
];

const PAGE_KEY = DB.qs('page') || 'pets';

async function init() {
  if (PAGE_KEY === 'classes') {
    location.replace('job_tree.html');
    return;
  }
  document.getElementById('guide-tabs').innerHTML = GUIDE_LIST.map(g =>
    `<a class="tab-pill ${g.key === PAGE_KEY ? 'active' : ''}" href="db_guide.html?page=${encodeURIComponent(g.key)}">${DB.esc(g.label)}</a>`
  ).join('') + `<a class="tab-pill" href="db_quests.html">📜 เควสต์ (Quests)</a>`;

  const meta = GUIDE_LIST.find(g => g.key === PAGE_KEY) || GUIDE_LIST[0];
  document.getElementById('hero-title').textContent = meta.label;
  document.title = meta.label + ' | อิลูน่าพลัส';

  try {
    const data = await DB.loadJSON(`data/db/guides/${meta.key}.json`);

    if (meta.key === 'classes') {
      renderClasses(data);
    } else if (meta.key === 'skills') {
      renderSkills(data);
    } else if (meta.key === 'abilities2') {
      renderAbilities2(data);
    } else if (meta.key === 'background_music' && data.tracks) {
      renderBGM(data);
    } else {
      renderStaticGuide(data);
    }
  } catch (e) {
    document.getElementById('guide-body').innerHTML = `<div class="empty-state">โหลดคู่มือไม่สำเร็จ: ${DB.esc(e.message)}</div>`;
  }
}

function renderStaticGuide(data) {
  document.getElementById('sub-toolbar').innerHTML = `
    <div class="db-panel">
      <div class="db-controls">
        <input class="db-input" id="guide-search" type="text" placeholder="ค้นหาข้อความในหน้าคู่มือนี้...">
      </div>
    </div>`;
  const body = document.getElementById('guide-body');
  body.innerHTML = `<div class="guide-content" id="guide-html">${data.html || '<p>ไม่มีข้อมูล</p>'}</div>`;

  document.getElementById('guide-search').addEventListener('input', e => {
    const q = e.target.value.trim().toLowerCase();
    const container = document.getElementById('guide-html');
    container.querySelectorAll('tr, p, li').forEach(el => {
      if (!q) { el.style.display = ''; return; }
      // keep table header rows visible
      if (el.tagName === 'TR' && el.querySelector('th')) { el.style.display = ''; return; }
      el.style.display = el.textContent.toLowerCase().includes(q) ? '' : 'none';
    });
  });
}

function renderClasses(data) {
  const initCls = DB.qs('class') || '';
  const list = data.classList || [];
  const labels = data.classLabels || {};
  document.getElementById('sub-toolbar').innerHTML = `
    <div class="db-panel">
      <div style="font-size:12.5px;color:var(--gold);margin-bottom:8px;font-weight:700">เลือกอาชีพเพื่อดูเงื่อนไขการเปลี่ยนอาชีพและสกิล:</div>
      <div class="chip-wrap" id="cls-chips">
        <button class="chip ${!initCls ? 'active' : ''}" onclick="showClass('', this)">🌳 ผังสายอาชีพทั้งหมด</button>
        ${list.map(c => `<button class="chip ${initCls === c ? 'active' : ''}" onclick="showClass('${DB.esc(c).replace(/'/g,"\\'")}', this)">${DB.esc(labels[c] || c)}</button>`).join('')}
      </div>
    </div>`;

  window.showClass = function (cls, btn) {
    if (btn) {
      document.querySelectorAll('#cls-chips .chip').forEach(c => c.classList.remove('active'));
      btn.classList.add('active');
    }
    const html = cls && data.details[cls]
      ? `<h2 style="margin-top:0">${DB.esc(labels[cls] || cls)}</h2>${data.details[cls]}`
      : data.treeHtml;
    document.getElementById('guide-body').innerHTML = `<div class="guide-content">${html || '<p>ไม่มีข้อมูล</p>'}</div>`;
  };
  showClass(initCls);
}

function renderSkills(data) {
  const list = data.classList || [];
  const labels = data.classLabels || {};
  const initCls = (DB.qs('class') && data.byClass[DB.qs('class')]) ? DB.qs('class') : (list[0] || '');
  document.getElementById('sub-toolbar').innerHTML = `
    <div class="db-panel">
      <div class="db-controls">
        <select class="db-select" id="sk-class-sel" onchange="showSkillClass(this.value)">
          ${list.map(c => `<option value="${DB.esc(c)}" ${c === initCls ? 'selected' : ''}>${DB.esc(labels[c] || c)}</option>`).join('')}
        </select>
        <input class="db-input" id="sk-filter" type="text" placeholder="ค้นหาชื่อสกิลหรือคำอธิบาย...">
      </div>
      <div class="chip-wrap" id="sk-chips" style="margin-top:10px">
        ${list.map(c => `<button class="chip ${c === initCls ? 'active' : ''}" data-cls="${DB.esc(c)}" onclick="selectSkillChip('${DB.esc(c).replace(/'/g,"\\'")}')">${DB.esc(labels[c] || c)}</button>`).join('')}
      </div>
    </div>`;

  window.selectSkillChip = function (cls) {
    document.getElementById('sk-class-sel').value = cls;
    showSkillClass(cls);
  };
  window.showSkillClass = function (cls) {
    document.querySelectorAll('#sk-chips .chip').forEach(c => c.classList.toggle('active', c.dataset.cls === cls));
    const html = data.byClass[cls] || '<p>ไม่มีข้อมูลสกิล</p>';
    document.getElementById('guide-body').innerHTML = `<div class="guide-content" id="sk-html"><h2 style="margin-top:0">✨ สกิลอาชีพ: ${DB.esc(labels[cls] || cls)}</h2>${html}</div>`;
    applySkillFilter();
  };
  function applySkillFilter() {
    const q = (document.getElementById('sk-filter')?.value || '').trim().toLowerCase();
    const box = document.getElementById('sk-html');
    if (!box) return;
    box.querySelectorAll('table').forEach(tbl => {
      tbl.style.display = (!q || tbl.textContent.toLowerCase().includes(q)) ? '' : 'none';
    });
  }
  document.getElementById('sk-filter').addEventListener('input', applySkillFilter);
  showSkillClass(initCls);
}

function renderAbilities2(data) {
  const list = data.list || [];
  const initAb = (DB.qs('ability') && data.details[DB.qs('ability')]) ? DB.qs('ability') : (list[0]?.key || '');
  document.getElementById('sub-toolbar').innerHTML = `
    <div class="db-panel">
      <div class="db-controls">
        <select class="db-select" id="ab-sel" onchange="showAbility(this.value)">
          ${list.map(a => `<option value="${DB.esc(a.key)}" ${a.key === initAb ? 'selected' : ''}>☆ ${DB.esc(a.label)}</option>`).join('')}
        </select>
        <input class="db-input" id="ab-filter" type="text" placeholder="กรองชื่อมอนสเตอร์ หรืออุปกรณ์ที่ดรอป...">
      </div>
      <div class="chip-wrap" id="ab-chips" style="margin-top:10px">
        ${list.map(a => `<button class="chip ${a.key === initAb ? 'active' : ''}" data-key="${DB.esc(a.key)}" onclick="selectAbChip('${DB.esc(a.key)}')">☆${DB.esc(a.label)}</button>`).join('')}
      </div>
    </div>`;

  window.selectAbChip = function (key) {
    document.getElementById('ab-sel').value = key;
    showAbility(key);
  };
  window.showAbility = function (key) {
    const item = list.find(a => a.key === key);
    document.querySelectorAll('#ab-chips .chip').forEach(c => c.classList.toggle('active', c.dataset.key === key));
    const html = data.details[key] || '<p>ไม่มีข้อมูล</p>';
    document.getElementById('guide-body').innerHTML = `<div class="guide-content" id="ab-html"><h2 style="margin-top:0">⭐ ☆${DB.esc(item ? item.label : key)}</h2>${html}</div>`;
    applyAbFilter();
  };
  function applyAbFilter() {
    const q = (document.getElementById('ab-filter')?.value || '').trim().toLowerCase();
    const box = document.getElementById('ab-html');
    if (!box) return;
    box.querySelectorAll('tr').forEach(tr => {
      if (tr.querySelector('th')) return;
      tr.style.display = (!q || tr.textContent.toLowerCase().includes(q)) ? '' : 'none';
    });
  }
  document.getElementById('ab-filter').addEventListener('input', applyAbFilter);
  showAbility(initAb);
}

function renderBGM(data) {
  const tracks = data.tracks || [];
  let curIdx = -1;
  let isLoop = false;
  let filtered = tracks;

  document.getElementById('sub-toolbar').innerHTML = `
    <div class="bgm-player-bar">
      <div class="bgm-now">
        <span class="bgm-now-title" id="bgm-now-title">🎵 คลิกเลือกเพลงด้านล่างเพื่อเริ่มเล่น (${tracks.length} เพลง)</span>
        <span id="bgm-status" class="badge gold">พร้อมเล่น</span>
      </div>
      <audio id="bgm-audio" class="bgm-audio" controls preload="none"></audio>
      <div class="bgm-controls">
        <button type="button" class="db-btn secondary" onclick="bgmStep(-1)">⏮ ก่อนหน้า</button>
        <button type="button" class="db-btn secondary" onclick="bgmStep(1)">⏭ ถัดไป</button>
        <button type="button" class="db-btn secondary" id="bgm-loop-btn" onclick="bgmToggleLoop()">🔁 วนซ้ำ: ปิด</button>
        <button type="button" class="db-btn secondary" onclick="bgmShuffle()">🔀 สุ่มเพลง</button>
        <a class="db-btn" id="bgm-dl-link" href="#" target="_blank" rel="noopener" style="display:none">⬇️ เปิด/โหลดไฟล์ .ogg</a>
      </div>
      <div id="bgm-err" style="display:none;margin-top:8px;font-size:12.5px;color:var(--orange)"></div>
    </div>
    <div class="db-panel">
      <div class="db-controls">
        <input class="db-input" id="bgm-search" type="text" placeholder="🔍 ค้นหาเลขเพลง หรือชื่อแผนที่/บอส (เช่น ไบลูน, โซเฟีย, Sofya, Ferzen, 32)...">
        <label style="display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text-dim);cursor:pointer;white-space:nowrap">
          <input type="checkbox" id="bgm-named-only" onchange="bgmRenderList()"> แสดงเฉพาะเพลงที่มีชื่อแผนที่/บอส
        </label>
      </div>
    </div>`;

  const audio = document.getElementById('bgm-audio');
  const titleEl = document.getElementById('bgm-now-title');
  const statusEl = document.getElementById('bgm-status');
  const dlLink = document.getElementById('bgm-dl-link');
  const errEl = document.getElementById('bgm-err');

  audio.addEventListener('playing', () => {
    statusEl.textContent = '▶ กำลังเล่น';
    errEl.style.display = 'none';
  });
  audio.addEventListener('pause', () => {
    if (!audio.ended) statusEl.textContent = '⏸ หยุดชั่วคราว';
  });
  audio.addEventListener('waiting', () => {
    statusEl.textContent = '⏳ กำลังโหลดเสียง...';
  });
  audio.addEventListener('ended', () => {
    if (isLoop) {
      audio.currentTime = 0;
      audio.play().catch(() => {});
    } else {
      bgmStep(1);
    }
  });
  audio.addEventListener('error', () => {
    statusEl.textContent = '⚠️ เล่นไม่ได้บนเบราว์เซอร์นี้';
    errEl.style.display = 'block';
    errEl.innerHTML = 'เบราว์เซอร์นี้อาจไม่รองรับไฟล์เสียง <code>.ogg</code> โดยตรง (เช่น Safari บน iOS) — แนะนำเปิดด้วย Chrome/Firefox หรือกดปุ่ม <strong>⬇️ เปิด/โหลดไฟล์ .ogg</strong> ด้านบนครับ';
  });

  window.bgmPlayById = function (id) {
    const idx = tracks.findIndex(t => t.id === id);
    if (idx < 0) return;
    curIdx = idx;
    const t = tracks[idx];
    titleEl.textContent = `🎵 #${t.id} ${t.title}`;
    statusEl.textContent = '⏳ กำลังโหลด...';
    errEl.style.display = 'none';
    dlLink.href = t.url;
    dlLink.style.display = 'inline-flex';
    audio.src = t.url;
    audio.play().catch(() => {
      statusEl.textContent = '▶ กดปุ่ม Play บนแถบเสียง';
    });
    document.querySelectorAll('.bgm-item').forEach(el => {
      const active = Number(el.dataset.id) === t.id;
      el.classList.toggle('playing', active);
      const ic = el.querySelector('.bgm-icon');
      if (ic) ic.textContent = active ? '🔊' : '▶';
    });
  };

  window.bgmStep = function (delta) {
    if (!filtered.length) return;
    const curId = curIdx >= 0 ? tracks[curIdx].id : -1;
    let fIdx = filtered.findIndex(t => t.id === curId);
    if (fIdx < 0) fIdx = delta > 0 ? 0 : filtered.length - 1;
    else fIdx = (fIdx + delta + filtered.length) % filtered.length;
    bgmPlayById(filtered[fIdx].id);
  };

  window.bgmToggleLoop = function () {
    isLoop = !isLoop;
    audio.loop = isLoop;
    const btn = document.getElementById('bgm-loop-btn');
    btn.textContent = isLoop ? '🔁 วนซ้ำ: เปิด' : '🔁 วนซ้ำ: ปิด';
    btn.classList.toggle('active', isLoop);
  };

  window.bgmShuffle = function () {
    if (!filtered.length) return;
    const pick = filtered[Math.floor(Math.random() * filtered.length)];
    bgmPlayById(pick.id);
  };

  window.bgmRenderList = function () {
    const q = (document.getElementById('bgm-search')?.value || '').trim().toLowerCase();
    const namedOnly = document.getElementById('bgm-named-only')?.checked;
    filtered = tracks.filter(t => {
      if (namedOnly && t.title === 'เพลงประกอบ (Music)') return false;
      if (q && !(String(t.id).includes(q) || t.title.toLowerCase().includes(q))) return false;
      return true;
    });
    const curId = curIdx >= 0 ? tracks[curIdx].id : -1;
    const body = document.getElementById('guide-body');
    if (!filtered.length) {
      body.innerHTML = `<div class="empty-state">ไม่พบเพลงที่ตรงกับคำค้นหา</div>`;
      return;
    }
    body.innerHTML = `
      <div class="count-bar"><span>แสดง ${filtered.length} จาก ${tracks.length} เพลง</span><span>💡 กดเลือกเพลงเพื่อฟังได้ทันที</span></div>
      <div class="bgm-grid">
        ${filtered.map(t => {
          const isPlaying = t.id === curId;
          return `<button type="button" class="bgm-item ${isPlaying ? 'playing' : ''}" data-id="${t.id}" onclick="bgmPlayById(${t.id})">
            <span class="bgm-num">#${t.id}</span>
            <span class="bgm-title" title="${DB.esc(t.title)}">${DB.esc(t.title)}</span>
            <span class="bgm-icon">${isPlaying ? '🔊' : '▶'}</span>
          </button>`;
        }).join('')}
      </div>`;
  };

  document.getElementById('bgm-search').addEventListener('input', bgmRenderList);
  bgmRenderList();
}

init();
</script>
</body>
</html>
