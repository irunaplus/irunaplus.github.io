<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/png" href="https://iruna-online.com/img/fankit/Colon_orange.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>แผนที่ &amp; มอนสเตอร์ (Zones) | อิลูน่าพลัส</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Noto+Sans+Thai:wght@300;400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="db_common.css">
<style>
  .hero { padding: 48px 20px 18px; }

  /* ===== Sticky Quick Switcher Bar ===== */
  .zone-sticky-bar {
    position: sticky; top: 8px; z-index: 60;
    background: rgba(14, 17, 30, 0.95);
    backdrop-filter: blur(10px);
    border: 1px solid var(--border-gold);
    border-radius: 12px;
    padding: 10px 12px;
    margin-bottom: 16px;
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    flex-wrap: wrap;
    box-shadow: 0 8px 28px rgba(0,0,0,0.45);
  }
  .zsb-left {
    display: flex; align-items: center; gap: 8px; flex: 1; min-width: 180px;
  }
  .zsb-picker-btn {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 8px 13px; border-radius: 8px;
    background: linear-gradient(135deg, rgba(212,168,67,0.22), rgba(212,168,67,0.1));
    border: 1px solid var(--gold);
    color: var(--gold-light);
    font-family: inherit; font-size: 13.5px; font-weight: 700;
    cursor: pointer; transition: all .18s; white-space: nowrap;
  }
  .zsb-picker-btn:hover { background: rgba(212,168,67,0.32); }
  .zsb-current {
    font-size: 14px; font-weight: 700; color: var(--text);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .zsb-actions {
    display: flex; align-items: center; gap: 6px; flex-shrink: 0;
  }
  .zsb-nav-btn {
    padding: 7px 11px; border-radius: 8px;
    background: rgba(30,41,59,0.75); border: 1px solid var(--border);
    color: var(--text); font-family: inherit; font-size: 12.5px; font-weight: 600;
    cursor: pointer; transition: all .15s; white-space: nowrap;
  }
  .zsb-nav-btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  .zsb-nav-btn:disabled { opacity: 0.38; cursor: not-allowed; }
  .zsb-ep-select {
    padding: 7px 10px; border-radius: 8px;
    background: rgba(12,16,30,0.92); border: 1px solid var(--border);
    color: var(--gold-light); font-family: inherit; font-size: 12.5px; font-weight: 600;
    cursor: pointer; outline: none;
  }

  /* ===== Desktop 2-Column Sticky Layout ===== */
  .zones-layout {
    display: grid; grid-template-columns: 340px 1fr; gap: 18px; align-items: start;
  }
  .tree-panel {
    position: sticky; top: 74px;
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    padding: 14px; max-height: calc(100vh - 90px);
    display: flex; flex-direction: column;
  }
  .tree-scroll {
    overflow-y: auto; flex: 1; padding-right: 4px;
    scrollbar-width: thin; scrollbar-color: rgba(212,168,67,0.35) transparent;
  }
  .tree-drawer-head {
    display: none; justify-content: space-between; align-items: center;
    padding-bottom: 10px; margin-bottom: 10px;
    border-bottom: 1px solid var(--border-gold);
  }
  .tree-drawer-head h3 { color: var(--gold-light); font-size: 16px; }
  .tree-backdrop {
    display: none; position: fixed; inset: 0; z-index: 1400;
    background: rgba(4,6,14,0.72); backdrop-filter: blur(3px);
  }

  /* ===== Mobile / Tablet Drawer Mode (<= 900px) ===== */
  @media (max-width: 900px) {
    .zones-layout { grid-template-columns: 1fr; }
    .zone-sticky-bar { top: 6px; padding-left: 58px; } /* space for hamburger btn */
    .tree-backdrop.open { display: block; }
    .tree-panel {
      position: fixed; left: 10px; right: 10px; bottom: 10px; top: 64px;
      z-index: 1500; max-height: none;
      background: #101424; border: 1px solid var(--gold);
      box-shadow: 0 20px 60px rgba(0,0,0,0.85);
      transform: translateY(110%); opacity: 0; pointer-events: none;
      transition: transform .25s cubic-bezier(.4,0,.2,1), opacity .2s;
    }
    .tree-panel.open {
      transform: translateY(0); opacity: 1; pointer-events: all;
    }
    .tree-drawer-head { display: flex; }
  }

  /* Hide picker button text on wide desktop where tree is already visible */
  @media (min-width: 901px) {
    .zsb-picker-btn { display: none; }
  }

  /* ===== Zone Tree Items ===== */
  .zone-tree, .zone-tree ul { list-style: none; padding-left: 14px; }
  .zone-tree { padding-left: 0; }
  .zone-tree li { margin: 3px 0; }
  .zt-row {
    display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
    padding: 6px 8px; border-radius: 7px; border: 1px solid transparent;
    transition: background .15s, border-color .15s;
  }
  .zt-row:hover { background: rgba(63,200,249,0.09); }
  .zt-row.active { background: rgba(212,168,67,0.18); border-color: var(--gold); }
  .zt-btn {
    background: none; border: none; color: var(--text); font-family: inherit;
    font-size: 13.5px; cursor: pointer; text-align: left; padding: 2px 0; flex: 1;
  }
  .zt-btn.town { color: #77d77b; font-weight: 700; }
  .zt-btn.field { color: #e8e0f0; }
  .zt-btn.dungeon { color: #f87171; }
  .zt-bs {
    font-size: 11px; padding: 2px 7px; border-radius: 5px;
    background: rgba(212,168,67,0.16); border: 1px solid rgba(212,168,67,0.45);
    color: var(--gold-light); cursor: pointer; font-family: inherit; flex-shrink: 0;
  }
  .zt-bs:hover { background: rgba(212,168,67,0.32); }

  /* ===== Detail Panel & Monster Cards ===== */
  @keyframes fadeInDetail {
    from { opacity: 0.4; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .detail-enter { animation: fadeInDetail .18s ease-out; }

  .mob-card {
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    padding: 14px; display: flex; gap: 14px; align-items: flex-start;
  }
  .mob-img {
    width: 68px; height: 68px; object-fit: contain; border-radius: 8px;
    background: rgba(10,12,24,0.7); border: 1px solid rgba(255,255,255,0.08);
    flex-shrink: 0; padding: 4px;
  }
  .mob-body { flex: 1; min-width: 0; }
  .mob-drops { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 7px; }
  .drop-chip {
    display: inline-block; padding: 3px 9px; border-radius: 5px; font-size: 12.5px;
    background: rgba(63,200,249,0.1); border: 1px solid rgba(63,200,249,0.28);
    color: var(--accent); text-decoration: none; cursor: pointer;
  }
  .drop-chip:hover { background: rgba(63,200,249,0.22); }
</style>
</head>
<body>
<div id="stars"></div>
<div id="sb-root"></div>

<div class="hero">
  <h1 class="hero-title" id="hero-title">🗺️ แผนที่ &amp; มอนสเตอร์ (Zones)</h1>
  <p class="hero-desc">แผนผังแผนที่ทุก Episode มอนสเตอร์ ดรอปไอเทม เควสต์ประจำเมือง และช่างตีเหล็ก (Blacksmith)</p>
</div>

<div class="main-wrapper">
  <div class="tab-strip" id="ep-tabs"></div>

  <!-- Sticky Quick Bar: always visible while scrolling -->
  <div class="zone-sticky-bar" id="zone-sticky-bar">
    <div class="zsb-left">
      <button type="button" class="zsb-picker-btn" onclick="openZoneDrawer()">
        🗺️ เลือกแผนที่
      </button>
      <span class="zsb-current" id="zsb-current">กำลังโหลด...</span>
    </div>
    <div class="zsb-actions">
      <select class="zsb-ep-select" id="zsb-ep-select" onchange="switchEp(this.value)" title="เปลี่ยน Episode"></select>
      <button type="button" class="zsb-nav-btn" id="btn-prev-zone" onclick="stepZone(-1)" title="แผนที่ก่อนหน้า">◀ ก่อนหน้า</button>
      <button type="button" class="zsb-nav-btn" id="btn-next-zone" onclick="stepZone(1)" title="แผนที่ถัดไป">ถัดไป ▶</button>
    </div>
  </div>

  <!-- Mobile Backdrop for Zone Picker Drawer -->
  <div class="tree-backdrop" id="tree-backdrop" onclick="closeZoneDrawer()"></div>

  <div class="zones-layout">
    <aside class="tree-panel" id="tree-panel" aria-label="รายการแผนที่">
      <div class="tree-drawer-head">
        <h3 id="drawer-title">🗺️ เลือกแผนที่</h3>
        <button type="button" class="db-modal-close" onclick="closeZoneDrawer()">✕</button>
      </div>
      <input class="db-input" id="zone-filter" type="text" placeholder="🔍 กรองชื่อแผนที่ หรือมอนสเตอร์..." style="width:100%;margin-bottom:8px;padding:8px 11px;font-size:13px;flex:none">
      <div style="font-size:11.5px;color:var(--text-dim);margin-bottom:8px;display:flex;gap:10px;flex-wrap:wrap">
        <span style="color:#77d77b">● เมือง (Town)</span>
        <span style="color:#e8e0f0">● แผนที่ (Field)</span>
        <span style="color:#f87171">● ดันเจี้ยน (Dungeon)</span>
      </div>
      <div class="tree-scroll" id="tree-wrap"><div class="loader">กำลังโหลดแผนที่...</div></div>
    </aside>

    <main id="detail-wrap">
      <div class="empty-state">เลือกแผนที่เพื่อดูมอนสเตอร์ ดรอปไอเทม เควสต์ และช่างตีเหล็ก</div>
    </main>
  </div>
</div>

<script src="db_common.js"></script>
<script>
DB.initSidebar();

let ZONES_META = [];
let EP_DATA = null;
let ZONE_ORDER = [];
let BLACKSMITHS = null;
let CURRENT_EP = DB.qs('ep') || 'EP1';
let ACTIVE_ZONE = DB.qs('zone') || '';
let ACTIVE_BS = DB.qs('blacksmith') || '';

function isMobileView() {
  return window.innerWidth <= 900;
}

function openZoneDrawer() {
  document.getElementById('tree-panel').classList.add('open');
  document.getElementById('tree-backdrop').classList.add('open');
  document.body.style.overflow = 'hidden';
  // Scroll active zone into view inside the drawer
  setTimeout(() => {
    const act = document.querySelector('#tree-wrap .zt-row.active');
    if (act) act.scrollIntoView({ block: 'center', behavior: 'instant' });
  }, 60);
}

function closeZoneDrawer() {
  document.getElementById('tree-panel').classList.remove('open');
  document.getElementById('tree-backdrop').classList.remove('open');
  document.body.style.overflow = '';
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeZoneDrawer();
});

function scrollToDetailTop() {
  const bar = document.getElementById('zone-sticky-bar');
  const detail = document.getElementById('detail-wrap');
  if (!detail) return;
  const rect = detail.getBoundingClientRect();
  const barH = bar ? bar.offsetHeight + 16 : 70;
  // Scroll smoothly if detail top is above the sticky bar OR far below viewport top
  if (rect.top < barH || rect.top > window.innerHeight * 0.45) {
    const targetY = window.scrollY + rect.top - barH;
    window.scrollTo({ top: Math.max(0, targetY), behavior: 'smooth' });
  }
}

async function init() {
  try {
    const [meta, epMap] = await Promise.all([
      DB.loadJSON('data/db/zones_meta.json'),
      DB.loadJSON('data/db/zone_ep_map.json'),
    ]);
    ZONES_META = meta;

    if (ACTIVE_ZONE && epMap[ACTIVE_ZONE]) {
      CURRENT_EP = epMap[ACTIVE_ZONE];
    }

    renderEpTabs();
    await loadEp(CURRENT_EP);

    if (ACTIVE_BS) {
      await showBlacksmith(ACTIVE_BS, false);
    } else if (ACTIVE_ZONE && EP_DATA.zones[ACTIVE_ZONE]) {
      showZone(ACTIVE_ZONE, false);
    } else {
      const firstKey = ZONE_ORDER[0] || Object.keys(EP_DATA.zones)[0];
      if (firstKey) showZone(firstKey, false);
    }
  } catch (e) {
    document.getElementById('tree-wrap').innerHTML = `<div class="empty-state">โหลดข้อมูลไม่สำเร็จ: ${DB.esc(e.message)}</div>`;
  }
}

function renderEpTabs() {
  document.getElementById('ep-tabs').innerHTML = ZONES_META.map(m =>
    `<a class="tab-pill ${m.key === CURRENT_EP ? 'active' : ''}" href="db_zones.html?ep=${encodeURIComponent(m.key)}" onclick="event.preventDefault(); switchEp('${DB.esc(m.key)}')">${DB.esc(m.label)} <span style="opacity:.7">(${m.zoneCount})</span></a>`
  ).join('');

  document.getElementById('zsb-ep-select').innerHTML = ZONES_META.map(m =>
    `<option value="${DB.esc(m.key)}" ${m.key === CURRENT_EP ? 'selected' : ''}>${DB.esc(m.label)} (${m.zoneCount})</option>`
  ).join('');
}

async function switchEp(ep) {
  if (!ep) return;
  CURRENT_EP = ep;
  ACTIVE_ZONE = '';
  ACTIVE_BS = '';
  document.getElementById('zone-filter').value = '';
  renderEpTabs();
  await loadEp(ep);
  const firstKey = ZONE_ORDER[0] || Object.keys(EP_DATA.zones)[0];
  if (firstKey) showZone(firstKey, true);
}

function collectZoneOrder(nodes, out) {
  for (const n of nodes) {
    if (n.slug && EP_DATA.zones[n.slug] && !out.includes(n.slug)) out.push(n.slug);
    if (n.children && n.children.length) collectZoneOrder(n.children, out);
  }
}

async function loadEp(ep) {
  document.getElementById('tree-wrap').innerHTML = '<div class="loader">กำลังโหลดแผนที่...</div>';
  EP_DATA = await DB.loadJSON(`data/db/zones/${ep}.json`);
  ZONE_ORDER = [];
  collectZoneOrder(EP_DATA.tree || [], ZONE_ORDER);
  for (const k of Object.keys(EP_DATA.zones || {})) {
    if (!ZONE_ORDER.includes(k)) ZONE_ORDER.push(k);
  }
  document.getElementById('hero-title').textContent = `🗺️ แผนที่: ${EP_DATA.label}`;
  document.getElementById('drawer-title').textContent = `🗺️ เลือกแผนที่ (${EP_DATA.label} · ${ZONE_ORDER.length} แห่ง)`;
  document.title = `Zones: ${EP_DATA.label} | อิลูน่าพลัส`;
  renderTree('');
}

document.getElementById('zone-filter').addEventListener('input', e => {
  renderTree(e.target.value.trim().toLowerCase());
});

function nodeMatches(node, q) {
  if (!q) return true;
  if (node.name.toLowerCase().includes(q) || node.slug.toLowerCase().includes(q)) return true;
  const z = EP_DATA.zones[node.slug];
  if (z && (z.monsters || []).some(m => m.name.toLowerCase().includes(q) || (m.drops || []).some(d => d.name.toLowerCase().includes(q)))) return true;
  if (node.children && node.children.some(c => nodeMatches(c, q))) return true;
  return false;
}

function buildTreeHtml(nodes, q) {
  let html = '<ul class="zone-tree">';
  for (const n of nodes) {
    if (!nodeMatches(n, q)) continue;
    const z = EP_DATA.zones[n.slug];
    const mc = z ? (z.monsters || []).length : 0;
    const isAct = ACTIVE_ZONE === n.slug && !ACTIVE_BS;
    html += `<li>
      <div class="zt-row ${isAct ? 'active' : ''}" data-zslug="${DB.esc(n.slug)}">
        <button type="button" class="zt-btn ${DB.esc(n.type || 'field')}" onclick="showZone('${DB.esc(n.slug).replace(/'/g,"\\'")}', true)">
          ${DB.esc(n.name)} ${mc ? `<span style="font-size:11px;color:var(--text-dim)">(${mc})</span>` : ''}
        </button>
        ${n.blacksmith ? `<button type="button" class="zt-bs" onclick="showBlacksmith('${DB.esc(n.blacksmith).replace(/'/g,"\\'")}', true)">🔨 ช่างตีเหล็ก</button>` : ''}
        ${n.crossEp ? `<span style="font-size:11px;color:var(--purple)">${DB.esc(n.crossEp)}</span>` : ''}
      </div>
      ${n.children && n.children.length ? buildTreeHtml(n.children, q) : ''}
    </li>`;
  }
  html += '</ul>';
  return html;
}

function renderTree(q) {
  document.getElementById('tree-wrap').innerHTML = buildTreeHtml(EP_DATA.tree || [], q);
}

function highlightActiveRow(slug) {
  document.querySelectorAll('.zt-row').forEach(r => r.classList.toggle('active', r.dataset.zslug === slug));
}

function updateStickyBar(label) {
  document.getElementById('zsb-current').textContent = label || '';
  const idx = ZONE_ORDER.indexOf(ACTIVE_ZONE);
  document.getElementById('btn-prev-zone').disabled = idx <= 0;
  document.getElementById('btn-next-zone').disabled = idx < 0 || idx >= ZONE_ORDER.length - 1;
}

function stepZone(delta) {
  const idx = ZONE_ORDER.indexOf(ACTIVE_ZONE);
  const nextIdx = idx + delta;
  if (nextIdx >= 0 && nextIdx < ZONE_ORDER.length) {
    showZone(ZONE_ORDER[nextIdx], true);
  }
}

function showZone(slug, shouldScroll) {
  ACTIVE_ZONE = slug;
  ACTIVE_BS = '';
  highlightActiveRow(slug);
  closeZoneDrawer();

  const z = EP_DATA.zones[slug];
  const wrap = document.getElementById('detail-wrap');
  if (!z) {
    wrap.innerHTML = `<div class="empty-state">ไม่พบข้อมูลแผนที่ ${DB.esc(slug)}</div>`;
    return;
  }

  updateStickyBar(`${z.name} (${(z.monsters || []).length} มอน)`);
  try {
    const newUrl = `db_zones.html?ep=${encodeURIComponent(CURRENT_EP)}&zone=${encodeURIComponent(slug)}`;
    history.replaceState(null, '', newUrl);
  } catch (_) {}

  const mobs = z.monsters || [];
  let html = `<div class="detail-enter"><div class="db-panel">
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;">
      <div>
        <h2 style="color:var(--gold-light);font-size:20px">${DB.esc(z.name)}</h2>
        <div style="font-size:13px;color:var(--text-dim);margin-top:2px">
          มอนสเตอร์ ${mobs.length} ตัว · เควสต์ ${(z.quests || []).length} เควสต์
        </div>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        ${z.blacksmith ? `<button class="db-btn" onclick="showBlacksmith('${DB.esc(z.blacksmith).replace(/'/g,"\\'")}', true)">🔨 เปิดรายการช่างตีเหล็ก (Blacksmith)</button>` : ''}
      </div>
    </div>
    ${mobs.length > 5 ? `<div style="margin-top:12px"><input class="db-input" id="in-zone-mob-filter" type="text" placeholder="🔍 ค้นหามอนสเตอร์หรือของดรอปในแผนที่นี้..." oninput="filterZoneMobs(this.value)" style="width:100%;padding:7px 11px;font-size:13px"></div>` : ''}
  </div>`;

  // Monsters
  if (mobs.length) {
    html += `<div id="zone-mobs-list" style="display:flex;flex-direction:column;gap:12px;margin-bottom:20px;">`;
    for (const m of mobs) {
      const imgUrl = m.img ? `https://th.iruna-online.info/iruna/${m.img.replace(/^\/+/, '')}` : '';
      const searchStr = (m.name + ' ' + (m.drops || []).map(d => d.name).join(' ') + ' ' + (m.area || '')).toLowerCase();
      html += `<div class="mob-card" data-search="${DB.esc(searchStr)}">
        ${imgUrl ? `<img class="mob-img" src="${DB.esc(imgUrl)}" alt="${DB.esc(m.name)}" loading="lazy" onerror="this.style.display='none'">` : ''}
        <div class="mob-body">
          <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px">
            <strong style="font-size:15.5px;color:var(--gold-light)">${DB.esc(m.name)}</strong>
            ${m.lv ? `<span class="badge red">Lv.${DB.esc(m.lv)}</span>` : ''}
            ${m.area ? `<span class="badge purple">${DB.esc(m.area)}</span>` : ''}
            ${m.attr ? `<span class="badge">ธาตุ: ${DB.esc(m.attr)}</span>` : ''}
            ${m.weak ? `<span class="badge green">แพ้: ${DB.esc(m.weak)}</span>` : ''}
            ${m.aggr ? `<span class="badge orange">${DB.esc(m.aggr)}</span>` : ''}
          </div>
          ${m.drops && m.drops.length ? `
            <div style="font-size:12px;color:var(--text-dim);margin-top:4px">ดรอปไอเทม:</div>
            <div class="mob-drops">
              ${m.drops.map(d => `<a class="drop-chip" href="javascript:void(0)" onclick="DB.openItemModal('${DB.esc(d.slug).replace(/'/g,"\\'")}', '${DB.esc(d.name).replace(/'/g,"\\'")}')">${DB.esc(d.name)}</a>`).join('')}
            </div>` : `<div style="font-size:12px;color:var(--text-dim)">ไม่มีข้อมูลดรอป</div>`}
        </div>
      </div>`;
    }
    html += `</div>`;
  } else {
    html += `<div class="db-panel" style="color:var(--text-dim);font-size:13.5px">ไม่มีมอนสเตอร์ในแผนที่นี้ (เขตเมือง / พื้นที่ปลอดภัย)</div>`;
  }

  // Quests in this zone
  if (z.quests && z.quests.length) {
    html += `<div class="db-panel"><h3 style="color:var(--gold-light);margin-bottom:12px;font-size:16px">📜 เควสต์ในแผนที่นี้ (${z.quests.length})</h3>
      <div style="display:flex;flex-direction:column;gap:10px;">`;
    for (const q of z.quests) {
      html += `<div class="db-card">
        <div class="db-card-title">
          <span>${q.mq ? `<span class="badge gold" style="margin-right:6px">${DB.esc(q.mq)}</span>` : ''}${DB.esc(q.title)}</span>
          ${q.exp ? `<span class="badge green">EXP ${DB.esc(q.exp)}</span>` : ''}
        </div>
        ${q.desc ? `<div style="font-size:13px;color:var(--text-dim);margin-bottom:5px">${DB.esc(q.desc)}</div>` : ''}
        ${q.npc ? `<div style="font-size:12.5px"><strong>NPC:</strong> ${DB.esc(q.npc)}</div>` : ''}
        ${q.reward ? `<div style="font-size:12.5px"><strong>รางวัล:</strong> ${DB.esc(q.reward)}</div>` : ''}
        ${q.skillReward ? `<div style="font-size:12.5px"><strong>รางวัลสกิล:</strong> <span class="badge purple">${DB.esc(q.skillReward)}</span></div>` : ''}
        ${q.objectives && q.objectives.length ? `<div style="font-size:12.5px;margin-top:4px"><strong>เป้าหมาย:</strong> ${q.objectives.map(o => o.kind === 'item'
          ? `<a class="item-link" href="javascript:void(0)" onclick="DB.openItemModal('${DB.esc(o.slug).replace(/'/g,"\\'")}', '${DB.esc(o.text).replace(/'/g,"\\'")}')">${DB.esc(o.text)}</a>`
          : `<span>${DB.esc(o.text)}</span>`).join(', ')}</div>` : ''}
      </div>`;
    }
    html += `</div></div>`;
  }

  html += `</div>`;
  wrap.innerHTML = html;

  if (shouldScroll) scrollToDetailTop();
}

function filterZoneMobs(val) {
  const q = val.trim().toLowerCase();
  document.querySelectorAll('#zone-mobs-list .mob-card').forEach(card => {
    card.style.display = (!q || (card.dataset.search || '').includes(q)) ? '' : 'none';
  });
}

async function showBlacksmith(bsSlug, shouldScroll) {
  ACTIVE_BS = bsSlug;
  highlightActiveRow('');
  closeZoneDrawer();

  const wrap = document.getElementById('detail-wrap');
  wrap.innerHTML = '<div class="loader">กำลังโหลดข้อมูลช่างตีเหล็ก...</div>';
  if (!BLACKSMITHS) {
    BLACKSMITHS = await DB.loadJSON('data/db/blacksmiths.json');
  }
  const bs = BLACKSMITHS[bsSlug];
  if (!bs) {
    wrap.innerHTML = `<div class="empty-state">ไม่พบข้อมูลช่างตีเหล็ก ${DB.esc(bsSlug)}</div>`;
    return;
  }

  updateStickyBar(`🔨 ช่างตีเหล็ก: ${bs.name}`);
  try {
    const newUrl = `db_zones.html?ep=${encodeURIComponent(CURRENT_EP)}&blacksmith=${encodeURIComponent(bsSlug)}`;
    history.replaceState(null, '', newUrl);
  } catch (_) {}

  let html = `<div class="detail-enter"><div class="db-panel">
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;">
      <div>
        <h2 style="color:var(--gold-light);font-size:20px">🔨 ช่างตีเหล็ก: ${DB.esc(bs.name)}</h2>
        <div style="font-size:13px;color:var(--text-dim)">รายการสร้างและอัปเกรดอุปกรณ์ที่ ${DB.esc(bs.name)}</div>
      </div>
      ${EP_DATA && EP_DATA.zones[bsSlug] ? `<button class="db-btn secondary" onclick="showZone('${DB.esc(bsSlug).replace(/'/g,"\\'")}', true)">← กลับไปข้อมูลเมือง</button>` : ''}
    </div>
  </div>`;

  for (const cat of (bs.categories || [])) {
    html += `<div class="db-panel">
      <h3 style="color:var(--gold-light);margin-bottom:10px;font-size:15.5px">${DB.esc(cat.cat)} (${cat.items.length})</h3>
      <div class="db-grid">
        ${cat.items.map(it => `
          <div class="db-card">
            <div class="db-card-title">
              <a href="javascript:void(0)" onclick="DB.openItemModal('${DB.esc(it.slug).replace(/'/g,"\\'")}', '${DB.esc(it.name).replace(/'/g,"\\'")}')">${DB.esc(it.name)}</a>
            </div>
            <div class="stat-en">${DB.esc(it.stats)}</div>
          </div>
        `).join('')}
      </div>
    </div>`;
  }
  html += `</div>`;
  wrap.innerHTML = html;

  if (shouldScroll) scrollToDetailTop();
}

init();
</script>
</body>
</html>
