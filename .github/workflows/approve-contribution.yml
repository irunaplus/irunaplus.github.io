# อนุมัติข้อมูลอาชีพ/สกิลจาก GitHub Issue อัตโนมัติเมื่อเจ้าของเว็บพิมพ์ /approve หรือติดป้าย approved
name: อนุมัติข้อมูลอาชีพ (Auto-Approve Contribution)

on:
  issue_comment:
    types: [created]
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write

jobs:
  approve:
    if: >
      (github.event_name == 'issue_comment' &&
       !github.event.issue.pull_request &&
       contains(github.event.comment.body, '/approve') &&
       (github.event.comment.author_association == 'OWNER' ||
        github.event.comment.author_association == 'MEMBER' ||
        github.event.comment.author_association == 'COLLABORATOR'))
      ||
      (github.event_name == 'issues' &&
       github.event.label.name == 'approved')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply approved contribution JSON
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: python scripts/apply_contribution.py

      - name: Commit and push updated data
        run: |
          git config user.name "irunaplus-bot"
          git config user.email "irunaplus-bot@users.noreply.github.com"
          git add data/jobs/ data/skills.json data/NPC/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "data: approve job contribution from issue #${{ github.event.issue.number }}"
            git push
          fi

      - name: Comment and close issue
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '✅ อนุมัติและอัปเดตข้อมูลขึ้นเว็บ **อิลูน่าพลัส** เรียบร้อยแล้วครับ! (กำลัง Deploy ขึ้นหน้าเว็บภายใน ~30 วินาที)'
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed'
            });
